version: 1
board: mp4_esp32_core
chip: esp32s3

devices:
  display_lcd:
    type: display_lcd
    sub_type: spi
    peripherals:
    - spi_display
    io:
      cs_gpio_num: 9
      dc_gpio_num: 39

  lcd_brightness:
    type: ledc_ctrl
    peripherals:
    - ledc_backlight

  audio_dac:
    type: audio_codec
    peripherals:
    - i2s_audio_out

  audio_adc:
    type: audio_codec
    peripherals:
    - i2s_audio_in
    - i2c_master

  imu_sensor:
    type: custom
    peripherals:
    - i2c_master

  board_buttons:
    type: custom

peripherals:
  i2c_master:
    type: i2c
    role: master
    io:
      sda_io_num: 1
      scl_io_num: 2

  i2s_audio_out:
    type: i2s
    role: master
    format: std-out
    io:
      mclk: 38
      bclk: 14
      ws: 13
      dout: 45
      din: 12

  i2s_audio_in:
    type: i2s
    role: master
    format: std-in
    io:
      mclk: 38
      bclk: 14
      ws: 13
      dout: 45
      din: 12

  spi_display:
    type: spi
    role: master
    io:
      mosi_io_num: 40
      sclk_io_num: 41

  ledc_backlight:
    type: ledc
    io:
      gpio_num: 42
