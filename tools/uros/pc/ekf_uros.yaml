# robot_localization EKF for the micro-ROS robot (uros_slam.launch.py):
# odom -> base_link from the gait's velocity (pc/odom) and the IMU's yaw rate
# (pc/imu), as ros2jazzympv2's baselink_to_odom.yaml does with the Pi bridge.
# pc/* are the robot's topics republished reliable by uros_relay.py.
uros_ekf:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    transform_time_offset: 0.0
    transform_timeout: 0.05
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az
    odom0: pc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    imu0: pc/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: false
