## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  ##
  ## 5.5.x is what this project is built and locked against. Do not move to
  ## IDF 6 without re-testing the servo bus: the SPI driver's transaction
  ## semantics and the i2c_master API are both on that path.
  idf:
    version: '>=5.4.0,<6.0.0'
  espressif/wasm-micro-runtime: ^1.3.2~1
  joltwallet/littlefs: ^1.22.1
  espressif/lua: ^5.5.0

  ## ── Audio (local-claw): ES7210 microphone ADC driver + the esp_codec_dev
  ## framework around it. The MAX98357A needs no codec at all; audio/
  ## mpx_audio.c writes to the I2S TX channel directly. Same version line
  ## mpv2-claw builds with (1.6.x).
  espressif/esp_codec_dev: ^1.6.2

  ## ── IMU: BMI270 + BMM150 ─────────────────────────────────
  ##
  ## The BMI270 will not produce a sample until an 8 KB Bosch configuration
  ## image has been uploaded into its feature engine, and that image is a Bosch
  ## binary blob. So this is driven through the Bosch Sensor API rather than by
  ## poking registers, which is what the QMI8658C on the Mini Pupper 2 board
  ## needed and what robot/imu.cc used to be.
  ##
  ## Do NOT swap these for lbuque/bmi270_bmm150_sensor, convenient as its
  ## combined API looks: it is built on the LEGACY i2c_bus component, and
  ## putting the legacy and new I2C drivers on one port is unsupported.
  espressif2022/bmi270: ^1.1.0
  ## Same shape of problem: bmi270.h declares bmi270_i2c_config_t with an
  ## i2c_bus_handle_t, so the header does not parse without i2c_bus.h even
  ## though nothing calls into the component. Only the sensor API
  ## (bmi2.c/bmi270.c, which is what this component actually is) is used.
  espressif/i2c_bus: '*'
  ## Used for bmm150.c - the chip's register map and, more to the point, its
  ## trim-register compensation maths. Its bmm150_aux_adapter is NOT used: that
  ## wrapper only tunnels register reads and never sets up the BMI270's AUX
  ## interface, which is what the magnetometer actually needs.
  tangyumei3535/bmm150_sensorapi: ^1.0.0
