# Peripherals for the Santy Control board.
#
# Source: Santy_Control_1201.pdf (Altium, 4 sheets, dated 2025-12-17).
#
# MCU: ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB octal PSRAM).
#
# The I2C, I2S and LCD pins are IDENTICAL to the MP4 ESP32 CORE board -- same
# nets, same numbers. That is not a coincidence: both descend from the
# HeySanta design in the xiaozhi-esp32 tree. Anything written against these
# pins works on both boards.
version: 1.0.0
peripherals:
  # Shared I2C bus: ES7210 audio ADC (0x41) and QMI8658A IMU (0x6a).
  # Nets IO1_I2C_SDA / IO2_I2C_SCL, 1 kOhm pull-ups (R15/R16).
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 1
        scl: 2

  # I2S0 full duplex: ES7210 in, MAX98357A out, sharing MCLK/BCLK/WS.
  # Nets: IO38_I2S_MCK, IO14_I2S_BCK, IO13_I2S_WS,
  #       IO12_I2S_DI (ES7210 -> ESP), IO45_I2S_DO (ESP -> MAX98357A).
  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config: &i2s0_config
      port: 0
      sample_rate_hz: 24000
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: 38
        bclk: 14
        ws: 13
        dout: 45
        din: 12

  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config: *i2s0_config

  # TFT on connector J4. Write-only 3-wire SPI, no MISO.
  # Nets: IO40_LCD_MOSI, IO41_LCD_SCK.
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        data0_io_num: 40
        sclk_io_num: 41
        max_transfer_sz: 153600

  # Backlight, net IO42_LCD_BL. Assumed to be the same inverted P-FET drive
  # as the MP4 board; if the panel lights at 0% and goes dark at 100%, flip
  # output_invert.
  - name: ledc_backlight
    type: ledc
    role: none
    config:
      gpio_num: 42
      freq_hz: 5000
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: true
